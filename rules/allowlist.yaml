# 这些路径下的文件不做注入/外链判定（文档、示例、测试数据）
doc_path_globs:
  - '**/*.md'
  - '**/*.mdx'
  - '**/*.rst'
  - '**/*.txt'
  - '**/docs/**'
  - '**/doc/**'
  - '**/examples/**'
  - '**/example/**'
  - '**/samples/**'

# 测试/夹具路径：默认仍扫描危险调用，但不判广告注入（测试数据常含假 URL 与联系方式）
test_path_globs:
  - '**/tests/**'
  - '**/test/**'
  - '**/__tests__/**'
  - '**/testdata/**'
  - '**/fixtures/**'
  - '**/*_test.py'
  - '**/test_*.py'
  - '**/*.test.js'
  - '**/*.spec.ts'
