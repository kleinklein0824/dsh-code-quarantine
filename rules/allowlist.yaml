  - fastapi.tiangolo.com
  - vuejs.org
  - reactjs.org
  - react.dev
  - angular.io
  - rust-lang.org
  - kubernetes.io
  - docker.com
  - postgresql.org
  - mysql.com
  - sqlite.org
  - redis.io
  - elastic.co
  - mozilla.org

# RFC 2606 / RFC 6761 保留域名与本地地址，永远不判为注入
reserved_domains:
  - example.com
  - example.net
  - example.org
  - example.edu
  - localhost
  - 127.0.0.1
  - 0.0.0.0
  - ::1
  - test.invalid
  - invalid

# 已知中转站/推广域名（默认只告警，可在此追加）
blocked_domains: []

# 可疑 TLD / 域名特征（正则，大小写不敏感）
suspicious_domain_patterns:
  - '\.(top|xyz|buzz|click|shop|vip|icu|cyou|monster|rest|bar)$'
  - '(^|\.)(dl|down|cdn|mirror|relay|proxy|api)[0-9]*-?[a-z0-9]*\.(top|xyz|buzz|icu)$'
  - '(^|\.)[a-z0-9]{1,3}-?[a-z0-9]{0,4}\.(tk|ml|ga|cf|gq)$'

# 私有 registry / 索引源白名单
registries:
  - registry.npmjs.org
  - registry.yarnpkg.com
  - pypi.org
  - files.pythonhosted.org

# 依赖名相似但合法的组合，避免 typosquat 误报
similar_packages:
  - [react, react-dom]
  - [react, preact]
  - [request, requests]
  - [boto, boto3]
  - [jose, python-jose]
  - [yaml, pyyaml]
  - [jwt, pyjwt]
  - [dateutil, python-dateutil]
  - [dotenv, python-dotenv]
  - [redis, redis-py]
  - [psycopg2, psycopg2-binary]
  - [grpc, grpcio]
  - [protobuf, google-protobuf]
  - [pillow, pil]
  - [opencv-python, opencv-contrib-python]
  - [jest, ts-jest]
  - [typescript, ts-node]
  - [eslint, tslint]

