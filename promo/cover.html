<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>cover</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#080d16}
  body{color:#e8edf5;font-family:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased}
  .bg{position:absolute;inset:0;
    background:
      radial-gradient(1000px 700px at 50% 8%, rgba(232,184,75,.16), transparent 62%),
      radial-gradient(900px 600px at 14% 96%, rgba(79,141,247,.14), transparent 60%),
      linear-gradient(180deg,#080d16 0%,#0b1220 100%);}
  .grid{position:absolute;inset:0;opacity:.55;
    background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size:72px 72px;
    -webkit-mask-image:radial-gradient(circle at 50% 42%,#000 30%,transparent 84%);}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
  .eye{width:250px;height:250px;margin-bottom:44px}
  .eye .draw path{stroke-dasharray:1;stroke-dashoffset:0}
  .eye .draw-iris{stroke-dasharray:36;stroke-dashoffset:0}
  h1{font-size:86px;font-weight:750;letter-spacing:-.02em;text-align:center;line-height:1.2}
  h1 em{font-style:normal;color:#e8b84b}
  .slogan{margin-top:26px;font-size:44px;color:#9aa8bd;letter-spacing:.02em}
  .url{margin-top:52px;font-family:ui-monospace,Consolas,monospace;font-size:38px;color:#fff;
    background:rgba(255,255,255,.05);border:1px solid #2a3752;border-radius:16px;padding:24px 46px;
    box-shadow:0 0 90px rgba(232,184,75,.22);display:flex;align-items:center;gap:2px}
  .url .host{color:#6d7b91}
  .url .repo{color:#e8b84b}
  .tags{margin-top:40px;display:flex;gap:16px}
  .tags span{font-size:23px;padding:11px 26px;border-radius:999px;border:1px solid #253044;color:#9aa8bd;background:rgba(13,20,33,.8)}
  .tags b{color:#e8b84b}
  .foot{position:absolute;bottom:56px;left:0;right:0;text-align:center;font-size:20px;color:#5d6b80;letter-spacing:.18em}
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid"></div>
<div class="wrap">
  <svg class="eye" viewBox="0 0 64 64">
    <g class="draw" fill="none" stroke="#e8b84b" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
      <path pathLength="1" d="M11 16C16.5 9.2 30.5 7.8 43 12.4"/>
      <path pathLength="1" d="M8.5 30.5C17 20.5 33 19.5 44 26.5"/>
      <path pathLength="1" d="M8.5 30.5C19 37.5 34 36 44 26.5"/>
      <path pathLength="1" d="M22.8 35.2C21.6 41.4 20.8 46 22.4 51"/>
      <path pathLength="1" d="M44 26.5C50.5 29.5 54 35 51 40.5C48.5 45 42.5 44 42.5 39.5C42.5 35.8 46.2 34.8 47.2 37.8"/>
    </g>
    <circle class="draw-iris" cx="26.2" cy="27.2" r="5.6" fill="none" stroke="#e8b84b" stroke-width="3.8"/>
    <circle class="pupil" cx="26.2" cy="27.2" r="2.3" fill="#e8b84b"/>
  </svg>
  <h1>AI 给你写的代码<br><em>你检查过吗？</em></h1>
  <div class="slogan">写入之前，先过一道检疫。</div>
  <div class="url"><span class="host">github.com/</span><span class="repo">kleinklein0824/dsh-code-quarantine</span></div>
  <div class="tags">
    <span><b>24</b> 条规则</span>
    <span><b>4</b> 层检测</span>
    <span>写入前拦截</span>
    <span><b>0</b> 第三方依赖</span>
  </div>
</div>
<div class="foot">MIT · 纯标准库 · Windows / macOS / Linux</div>
</body>
</html>
